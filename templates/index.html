<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitScript</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0f0f0f;
            --card: #181818;
            --border: #262626;
            --accent: #c8f135;
            --text: #f0f0f0;
            --muted: #666;
            --warning: #ff6b35;
            --info: #4fc3f7;
            --pr: #ffc94d;
        }

        body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

        header {
            padding: 24px 40px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 2px; color: var(--accent); }

        .header-stats { display: flex; gap: 28px; align-items: flex-end; }
        .stat-item { text-align: right; }
        .stat-val { display: block; font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--accent); line-height: 1; }
        .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }

        .container {
            max-width: 1120px;
            margin: 0 auto;
            padding: 32px 24px;
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 24px;
        }

        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 22px; }
        .card h2 { font-family: 'Bebas Neue', sans-serif; font-size: 19px; letter-spacing: 1px; margin-bottom: 16px; color: var(--accent); }

        /* FORM */
        .form-group { margin-bottom: 11px; }

        label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px; }

        input, select {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 8px 11px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            transition: border-color 0.15s;
        }

        input:focus, select:focus { outline: none; border-color: var(--accent); }
        select option { background: var(--card); }

        /* SET INPUTS ROW */
        .set-input-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 8px;
            align-items: flex-end;
            margin-bottom: 10px;
        }

        .set-input-row input { margin: 0; }

        button.add-set {
            background: var(--border);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 8px 14px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: border-color 0.15s, background 0.15s;
        }

        button.add-set:hover { border-color: var(--accent); background: rgba(200,241,53,0.06); color: var(--accent); }

        /* SETS LIST */
        #sets-list { margin-bottom: 12px; }

        .set-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .set-item span { color: var(--muted); }
        .set-item span strong { color: var(--text); font-weight: 500; }

        .set-remove {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 15px;
            line-height: 1;
            padding: 0 2px;
            transition: color 0.1s;
        }

        .set-remove:hover { color: var(--warning); }

        .date-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
        .date-row label { margin: 0; white-space: nowrap; }
        .date-row input { padding: 7px 10px; font-size: 13px; }

        button.primary {
            width: 100%;
            background: var(--accent);
            color: #0f0f0f;
            border: none;
            border-radius: 8px;
            padding: 11px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 17px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        button.primary:hover { opacity: 0.85; }
        button.primary:disabled { opacity: 0.35; cursor: not-allowed; }

        #form-msg { margin-top: 8px; font-size: 13px; text-align: center; min-height: 18px; }

        .right { display: flex; flex-direction: column; gap: 20px; }

        /* SUGGESTIONS */
        #suggestions-list { display: flex; flex-direction: column; gap: 8px; }

        .suggestion { padding: 10px 13px; border-radius: 7px; font-size: 13.5px; line-height: 1.5; border-left: 3px solid; }
        .suggestion.warning { background: rgba(255,107,53,0.08); border-color: var(--warning); color: #ffaa88; }
        .suggestion.info    { background: rgba(79,195,247,0.08); border-color: var(--info); color: #9ee4ff; }
        .suggestion.progress { background: rgba(200,241,53,0.08); border-color: var(--accent); color: var(--accent); }

        /* HISTORY */
        .table-wrap { overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }

        th { text-align: left; padding: 7px 10px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; border-bottom: 1px solid var(--border); }
        td { padding: 9px 10px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: top; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.02); }

        /* Grouped history rows */
        .sets-detail { margin-top: 4px; display: flex; flex-direction: column; gap: 2px; }
        .set-line { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
        .set-line strong { color: var(--text); font-weight: 400; }
        .set-line .delete-btn { padding: 1px 6px; font-size: 11px; }

        .delete-btn {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 3px 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
        }

        .delete-btn:hover { border-color: var(--warning); color: var(--warning); }

        .pr-badge {
            font-size: 11px;
            font-weight: 600;
            color: var(--pr);
            background: rgba(255,201,77,0.1);
            border: 1px solid rgba(255,201,77,0.3);
            border-radius: 4px;
            padding: 1px 5px;
            margin-left: 5px;
            vertical-align: middle;
        }

        .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 20px 0; }
    </style>
</head>
<body>

<header>
    <h1>FitScript</h1>
    <div class="header-stats">
        <div class="stat-item">
            <span class="stat-val" id="stat-streak">—</span>
            <span class="stat-label">day streak</span>
        </div>
        <div class="stat-item">
            <span class="stat-val" id="stat-sessions">—</span>
            <span class="stat-label">sessions</span>
        </div>
        <div class="stat-item">
            <span class="stat-val" id="stat-volume">—</span>
            <span class="stat-label">lbs lifted</span>
        </div>
    </div>
</header>

<div class="container">

    <div>
        <div class="card">
            <h2>Log Exercise</h2>

            <div class="form-group">
                <label>Muscle Group</label>
                <select id="muscle_group" onchange="updateExerciseSuggestions()">
                    <option value="">Select...</option>
                    <option value="chest">Chest</option>
                    <option value="back">Back</option>
                    <option value="legs">Legs</option>
                    <option value="shoulders">Shoulders</option>
                    <option value="arms">Arms</option>
                    <option value="core">Core</option>
                </select>
            </div>

            <div class="form-group">
                <label>Exercise</label>
                <input type="text" id="exercise" placeholder="e.g. Bench Press" list="exercise-suggestions" autocomplete="off" oninput="onExerciseChange()">
                <datalist id="exercise-suggestions"></datalist>
            </div>

            <div class="set-input-row">
                <div>
                    <label>Reps</label>
                    <input type="number" id="reps" placeholder="10" min="1" onkeydown="handleSetKey(event)">
                </div>
                <div>
                    <label>Weight (lbs)</label>
                    <input type="number" id="weight" placeholder="135" min="0" step="2.5" onkeydown="handleSetKey(event)">
                </div>
                <button class="add-set" onclick="addSet()">+ Set</button>
            </div>

            <div id="sets-list"></div>

            <div class="date-row">
                <label>Date</label>
                <input type="date" id="date" onchange="updateLogButtonState()">
            </div>

            <button class="primary" id="log-btn" onclick="logWorkout()" disabled>Log Exercise</button>
            <div id="form-msg"></div>
        </div>
    </div>

    <div class="right">

        <div class="card">
            <h2>Smart Suggestions</h2>
            <div id="suggestions-list">
                <div class="empty">Log a workout to get suggestions</div>
            </div>
        </div>

        <div class="card">
            <h2>Progress</h2>
            <div class="form-group" style="margin-bottom: 14px;">
                <select id="progress-exercise" onchange="loadProgress(this.value)">
                    <option value="">Select an exercise...</option>
                </select>
            </div>
            <div id="chart-wrap">
                <p class="empty">Select an exercise to see your progress</p>
            </div>
        </div>

        <div class="card">
            <h2>History</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Exercise</th>
                            <th>Group</th>
                            <th>Sets</th>
                        </tr>
                    </thead>
                    <tbody id="workout-table">
                        <tr><td colspan="4" class="empty">No workouts logged yet</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script>
    const EXERCISES = {
        chest:     ['Bench Press', 'Incline Bench Press', 'Dumbbell Fly', 'Push-up', 'Cable Crossover', 'Decline Press'],
        back:      ['Pull-up', 'Barbell Row', 'Lat Pulldown', 'Seated Cable Row', 'Deadlift', 'Face Pull'],
        legs:      ['Squat', 'Romanian Deadlift', 'Leg Press', 'Lunge', 'Leg Curl', 'Leg Extension', 'Calf Raise'],
        shoulders: ['Overhead Press', 'Lateral Raise', 'Front Raise', 'Arnold Press', 'Upright Row', 'Rear Delt Fly'],
        arms:      ['Bicep Curl', 'Tricep Pushdown', 'Hammer Curl', 'Skull Crusher', 'Dip', 'Concentration Curl'],
        core:      ['Plank', 'Crunch', 'Leg Raise', 'Russian Twist', 'Ab Wheel', 'Cable Crunch']
    };

    let pendingSets = [];  // [{reps, weight}]
    let progressChart = null;

    document.getElementById('date').valueAsDate = new Date();

    window.onload = () => { loadWorkouts(); loadSuggestions(); loadStats(); };

    function updateLogButtonState() {
        const hasSets = pendingSets.length > 0;
        const exercise = document.getElementById('exercise').value.trim();
        const muscle_group = document.getElementById('muscle_group').value;
        const date = document.getElementById('date').value;
        const ok = hasSets && exercise.length >= 2 && !!muscle_group && !!date;
        document.getElementById('log-btn').disabled = !ok;
    }

    function updateExerciseSuggestions() {
        const group = document.getElementById('muscle_group').value;
        const datalist = document.getElementById('exercise-suggestions');
        datalist.innerHTML = (EXERCISES[group] || []).map(e => `<option value="${e}">`).join('');
        document.getElementById('exercise').value = '';
        pendingSets = [];
        renderSets();
        document.getElementById('exercise').focus();
        updateLogButtonState();
    }

    function onExerciseChange() {
        // Clear sets when switching exercises mid-session
        if (pendingSets.length) {
            pendingSets = [];
            renderSets();
        }
        updateLogButtonState();
    }

    function handleSetKey(e) {
        if (e.key === 'Enter') addSet();
    }

    function addSet() {
        const reps = parseInt(document.getElementById('reps').value);
        const weight = parseFloat(document.getElementById('weight').value);
        if (!reps || isNaN(weight) || weight < 0) {
            flashMsg('Enter reps and weight first.', 'var(--warning)');
            return;
        }
        pendingSets.push({ reps, weight });
        renderSets();
        // Keep weight, clear reps — common to do same weight next set
        document.getElementById('reps').value = '';
        document.getElementById('reps').focus();
    }

    function removeSet(i) {
        pendingSets.splice(i, 1);
        renderSets();
    }

    function renderSets() {
        const container = document.getElementById('sets-list');
        updateLogButtonState();

        if (!pendingSets.length) { container.innerHTML = ''; return; }

        container.innerHTML = pendingSets.map((s, i) => `
            <div class="set-item">
                <span><strong>Set ${i + 1}</strong> &nbsp; ${s.reps} reps &nbsp;@&nbsp; ${s.weight} lbs</span>
                <button class="set-remove" onclick="removeSet(${i})" title="Remove">×</button>
            </div>
        `).join('');
    }

    async function logWorkout() {
        if (!pendingSets.length) return;
        const exercise = document.getElementById('exercise').value.trim();
        const muscle_group = document.getElementById('muscle_group').value;
        const date = document.getElementById('date').value;

        if (!exercise || !muscle_group || !date) {
            flashMsg('Fill in muscle group, exercise and date.', 'var(--warning)');
            return;
        }
        if (exercise.length < 2) {
            flashMsg('Exercise name is too short.', 'var(--warning)');
            return;
        }

        const res = await fetch('/log_workout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ exercise, muscle_group, date, sets: pendingSets })
        });
        const result = await res.json();

        if (res.ok) {
            flashMsg(result.is_pr ? 'New personal record!' : `${pendingSets.length} set${pendingSets.length > 1 ? 's' : ''} logged.`,
                     result.is_pr ? 'var(--pr)' : 'var(--accent)');
            const loggedExercise = exercise;
            pendingSets = [];
            renderSets();
            document.getElementById('exercise').value = '';
            document.getElementById('reps').value = '';
            document.getElementById('weight').value = '';
            document.getElementById('exercise').focus();

            loadWorkouts().then(() => {
                const sel = document.getElementById('progress-exercise');
                if ([...sel.options].some(o => o.value === loggedExercise)) {
                    sel.value = loggedExercise;
                    loadProgress(loggedExercise);
                }
            });
            loadSuggestions();
            loadStats();
        } else {
            flashMsg(result.error || 'Something went wrong.', 'var(--warning)');
        }
    }

    function flashMsg(text, color) {
        const el = document.getElementById('form-msg');
        el.style.color = color;
        el.textContent = text;
        setTimeout(() => { el.textContent = ''; }, 3000);
    }

    async function loadWorkouts() {
        const res = await fetch('/get_workouts');
        const { workouts } = await res.json();
        const tbody = document.getElementById('workout-table');

        if (!workouts.length) {
            tbody.innerHTML = '<tr><td colspan="4" class="empty">No workouts logged yet</td></tr>';
            document.getElementById('progress-exercise').innerHTML = '<option value="">Select an exercise...</option>';
            return;
        }

        // Find max weight per exercise for PR marking
        const maxWeights = {};
        for (const w of workouts) {
            const k = w.exercise.toLowerCase();
            if (!maxWeights[k] || w.weight > maxWeights[k]) maxWeights[k] = w.weight;
        }

        // Group by date → exercise
        const grouped = {};
        for (const w of workouts) {
            const key = `${w.date}||${w.exercise}||${w.muscle_group}`;
            if (!grouped[key]) grouped[key] = { date: w.date, exercise: w.exercise, muscle_group: w.muscle_group, sets: [] };
            grouped[key].sets.push({ id: w.id, reps: w.reps, weight: w.weight });
        }

        const rows = Object.values(grouped).sort((a, b) => b.date.localeCompare(a.date) || a.exercise.localeCompare(b.exercise));

        tbody.innerHTML = rows.map(g => {
            const isPR = g.sets.some(s => s.weight === maxWeights[g.exercise.toLowerCase()]);
            const setsHtml = g.sets.map((s, i) => `
                <div class="set-line">
                    <span>Set ${i + 1}: <strong>${s.reps} reps @ ${s.weight} lbs</strong></span>
                    <button class="delete-btn" onclick="deleteWorkout(${s.id})">×</button>
                </div>
            `).join('');
            return `<tr>
                <td style="white-space:nowrap">${g.date}</td>
                <td>${g.exercise}${isPR ? '<span class="pr-badge">PR</span>' : ''}
                    <div class="sets-detail">${setsHtml}</div>
                </td>
                <td style="white-space:nowrap">${g.muscle_group}</td>
                <td>${g.sets.length}</td>
            </tr>`;
        }).join('');

        // Update progress dropdown
        const exercises = [...new Set(workouts.map(w => w.exercise))];
        const sel = document.getElementById('progress-exercise');
        const cur = sel.value;
        sel.innerHTML = '<option value="">Select an exercise...</option>' + exercises.map(e => `<option value="${e}">${e}</option>`).join('');
        if (cur && exercises.includes(cur)) sel.value = cur;
    }

    async function loadSuggestions() {
        const res = await fetch('/suggestions');
        const data = await res.json();
        document.getElementById('suggestions-list').innerHTML = data.map(s =>
            `<div class="suggestion ${s.type}">${s.message}</div>`
        ).join('');
    }

    async function loadStats() {
        const res = await fetch('/stats');
        const data = await res.json();
        document.getElementById('stat-streak').textContent = data.streak;
        document.getElementById('stat-sessions').textContent = data.total_sessions;
        document.getElementById('stat-volume').textContent = new Intl.NumberFormat().format(data.total_volume);
    }

    async function loadProgress(exercise) {
        const wrap = document.getElementById('chart-wrap');
        if (!exercise) {
            wrap.innerHTML = '<p class="empty">Select an exercise to see your progress</p>';
            if (progressChart) { progressChart.destroy(); progressChart = null; }
            return;
        }
        const res = await fetch(`/progress?exercise=${encodeURIComponent(exercise)}`);
        const data = await res.json();
        if (data.length < 2) {
            wrap.innerHTML = '<p class="empty">Need at least 2 sessions to show progress</p>';
            if (progressChart) { progressChart.destroy(); progressChart = null; }
            return;
        }
        wrap.innerHTML = '<canvas id="progress-chart" height="110"></canvas>';
        if (progressChart) progressChart.destroy();
        progressChart = new Chart(document.getElementById('progress-chart').getContext('2d'), {
            type: 'line',
            data: {
                labels: data.map(d => d.date),
                datasets: [{ data: data.map(d => d.weight), borderColor: '#c8f135', backgroundColor: 'rgba(200,241,53,0.07)', pointBackgroundColor: '#c8f135', pointRadius: 4, tension: 0.35, fill: true }]
            },
            options: {
                plugins: { legend: { display: false } },
                scales: {
                    x: { ticks: { color: '#666', font: { size: 11 } }, grid: { color: '#1e1e1e' } },
                    y: { ticks: { color: '#666', font: { size: 11 } }, grid: { color: '#1e1e1e' } }
                }
            }
        });
    }

    async function deleteWorkout(id) {
        await fetch(`/delete_workout/${id}`, { method: 'DELETE' });
        loadWorkouts();
        loadSuggestions();
        loadStats();
    }
</script>

</body>
</html>
