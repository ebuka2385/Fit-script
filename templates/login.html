<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitScript — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a0a;
            --card: #141414;
            --border: #222;
            --accent: #c8f135;
            --text: #f0f0f0;
            --muted: #555;
            --warning: #ff6b35;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .brand {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 48px;
            letter-spacing: 5px;
            color: var(--accent);
            margin-bottom: 6px;
        }

        .tagline {
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 36px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 380px;
        }

        /* Tabs */
        .tab-bar {
            display: flex;
            border-bottom: 1px solid var(--border);
            margin-bottom: 26px;
        }
        .tab {
            flex: 1;
            background: none;
            border: none;
            color: var(--muted);
            font-family: 'Bebas Neue', sans-serif;
            font-size: 16px;
            letter-spacing: 1.5px;
            padding: 8px 0 10px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: color 0.15s, border-color 0.15s;
        }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

        /* Form */
        .form-group { margin-bottom: 14px; }
        label {
            display: block;
            font-size: 10px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 13px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            transition: border-color 0.15s;
        }
        input:focus { outline: none; border-color: var(--accent); }

        button[type="submit"] {
            width: 100%;
            margin-top: 6px;
            background: var(--accent);
            color: #0a0a0a;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 18px;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        button[type="submit"]:hover { opacity: 0.85; }

        .error-msg {
            margin-top: 14px;
            padding: 10px 13px;
            background: rgba(255,107,53,0.08);
            border: 1px solid rgba(255,107,53,0.3);
            border-radius: 7px;
            color: #ffaa88;
            font-size: 13px;
            text-align: center;
        }

        /* Decorative grid lines */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(200,241,53,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(200,241,53,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }
        body > * { position: relative; z-index: 1; }
    </style>
</head>
<body>

<div class="brand">FitScript</div>
<div class="tagline">Train smart. Lift heavy. Stay healthy.</div>

<div class="card">
    <div class="tab-bar">
        <button class="tab {% if tab == 'signup' %}{% else %}active{% endif %}" id="tab-login" onclick="switchTab('login')" type="button">Login</button>
        <button class="tab {% if tab == 'signup' %}active{% endif %}" id="tab-signup" onclick="switchTab('signup')" type="button">Sign Up</button>
    </div>

    <div id="panel-login" {% if tab == 'signup' %}style="display:none"{% endif %}>
        <form method="POST" action="/login">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="your username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>

    <div id="panel-signup" {% if tab != 'signup' %}style="display:none"{% endif %}>
        <form method="POST" action="/signup">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="choose a username" autocomplete="username" required minlength="3">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="min. 6 characters" autocomplete="new-password" required minlength="6">
            </div>
            <button type="submit">Create Account</button>
        </form>
    </div>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}
</div>

<script>
    function switchTab(tab) {
        document.getElementById('panel-login').style.display  = tab === 'login'  ? '' : 'none';
        document.getElementById('panel-signup').style.display = tab === 'signup' ? '' : 'none';
        document.getElementById('tab-login').classList.toggle('active',  tab === 'login');
        document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
    }
</script>

</body>
</html>
